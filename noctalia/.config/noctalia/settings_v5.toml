[audio]
enable_sounds = true

[backdrop]
enabled = true

[bar.default]
capsule = true
center = [ "clock", "workspaces", "cat" ]
concave_edge_corners = true
contact_shadow = true
end = [ "tray", "group:g2", "group:g4", "group:g3" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
start = [ "group:g1", "privacy", "media" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "ram", "network_tx", "network_rx" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "volume", "brightness" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "control-center", "session" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "recorder", "notifications", "clipboard", "keybinds", "widget" ]
    opacity = 1.0
    padding = 6.0

[brightness]
enable_ddcutil = true
minimum_brightness = 0.28999999351799488
sync_all_monitors = true

[calendar]
enabled = true

    [calendar.account.wppopqpu]
    type = "google"

[control_center]
sidebar = "full"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "screen_time"

    [[control_center.shortcuts]]
    type = "system"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 540.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        visualization_mode = "wave_rings"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 272.0
    box_width = 304.0
    cx = 494.0
    cy = 376.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "media_player"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        hide_when_no_media = true
        layout = "vertical"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 224.0
    box_width = 224.0
    cx = 1584.0
    cy = 300.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        background = true
        clock_style = "analog"

[dock]
auto_hide = true
background_opacity = 0.76999998278915882
enabled = true
launcher_custom_image_colorize = true
launcher_position = "start"
magnification_scale = 1.2000000029802322
reserve_space = false
show_dots = true

[hot_corners]
enabled = true

    [hot_corners.top_right]
    action = "launcher"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[keybinds]
down = [ "Down", "Alt+j" ]
left = [ "Left", "Alt+h" ]
right = [ "Right", "Alt+l" ]
up = [ "Up", "Alt+k" ]

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.0
blurred_desktop = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[notification]
layer = "overlay"
position = "bottom_right"

[osd]
position = "bottom_right"

[plugin_settings."noctalia/screen_recorder"]
directory = "~/videos/screen_records"
filename_pattern = "recording_%Y%m%d_%H%M%S"

[plugin_settings."yuuto/arch-updater"]
aur_helper = "yay"
flatpak_enabled = false
panel_placement = "floating"

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/bongocat", "kenn/keybind-cheatsheet", "yuuto/arch-updater" ]

[shell]
avatar_path = "/home/branch/pictures/wallpapers/reisen.jpg"
external_ip_enabled = true
font_family = "Adwaita Mono"
launch_apps_as_systemd_services = true
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.greeter_sync]
    auto_sync = false
    privilege_command = "pkexec"

    [shell.launcher]
    session_search = true

    [shell.panel]
    control_center_placement = "floating"
    launcher_position = "bottom_center"
    session_placement = "floating"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    confirm_region = true
    directory = "/home/branch/pictures/screenshots"
    filename_pattern = "ps%Y%M%D%H%M%S"

    [shell.shadow]
    direction = "down_right"

[theme]
community_palette = "ADW"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

[hooks]
colors_changed = "fish /home/branch/dotfiles/fcitx/scripts/generate-mellow-theme.fish"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "helix", "kcolorscheme", "niri", "qt" ]
    community_ids = [ "gimp", "libreoffice", "steam", "fastfetch", "zathura", "yazi" ]

[wallpaper]
directory = "/home/branch/pictures/wallpapers"
fill_color = "secondary"
transition_on_startup = true

    [wallpaper.automation]
    enabled = false
    interval_seconds = 7200

    [wallpaper.default]
    path = "/home/branch/pictures/wallpapers/satori_komeiji.jpg"

    [wallpaper.last]
    path = "/home/branch/pictures/wallpapers/satori_komeiji.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/branch/pictures/wallpapers/satori_komeiji.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/branch/pictures/wallpapers/satori_komeiji.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "faithful"

    [[wallpaper.favorite]]
    path = "/home/branch/pictures/wallpapers/alice.png"
    theme_mode = "auto"

    [[wallpaper.favorite]]
    path = "/home/branch/pictures/wallpapers/reisen.jpg"
    theme_mode = "auto"

    [[wallpaper.favorite]]
    path = "/home/branch/pictures/wallpapers/remilia&flandre.jpg"
    theme_mode = "auto"

[widget.brightness]
show_label = false

[widget.cat]
# this will be replaced by script in .lcoal/state/noctalia/settings.toml
input_devices = [ "/dev/input/event21" ]
scale = 1.7
type = "noctalia/bongocat:cat"

[widget.clock]
font_family = "Adwaita Mono"

[widget.cpu]
show_label = false
show_value = false

[widget.keybinds]
type = "kenn/keybind-cheatsheet:keybinds"

[widget.media]
hide_when_no_media = true

[widget.network_rx]
show_label = false
show_value = false

[widget.network_tx]
show_label = false
show_value = false

[widget.privacy]
capsule = true
hide_inactive = true

[widget.ram]
show_label = false
show_value = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.sysmon]
show_value = false
stat = "ram_pct"

[widget.tray]
drawer = true
pinned = [ "Fcitx" ]

[widget.volume]
show_label = false

[widget.widget]
type = "yuuto/arch-updater:widget"

[widget.workspaces]
anchor = true
