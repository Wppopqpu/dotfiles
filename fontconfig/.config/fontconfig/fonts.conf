<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <match target="font">
        <edit mode="assign" name="antialias">
            <bool>true</bool>
        </edit>
    </match>

    <!-- 中文 sans-serif 回退链: FandolSong → Noto Sans CJK SC -->
    <match>
        <test compare="contains" name="lang">
            <string>zh-cn</string>
        </test>
        <edit mode="prepend" name="family" binding="strong">
            <string>Latin Modern Roman</string>
            <string>FandolSong</string>
            <string>FandolKai</string>
            <string>Noto Sans CJK SC</string>
        </edit>
    </match>

    <!-- FandolSong 元数据 bug: Bold weight=80=Regular, 强制 Regular -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>FandolSong</string>
        </test>
        <edit name="style" mode="assign" binding="strong">
            <string>Regular</string>
        </edit>
        <edit name="weight" mode="assign" binding="strong">
            <int>80</int>
        </edit>
    </match>

    <!-- serif 回退链: Latin Modern Roman → FandolSong → Noto Serif -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Latin Modern Roman</string>
            <string>FandolSong</string>
            <string>FandolKai</string>
            <string>Noto Serif</string>
        </edit>
    </match>

    <!-- sans-serif 通用首选: Latin Modern Roman -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Latin Modern Roman</string>
            <string>FandolSong</string>
        </edit>
    </match>

    <!-- monospace: FiraCode Nerd Font -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>FiraCode Nerd Font</string>
            <string>FandolSong</string>
			<string>FandolKai</string>
        </edit>
    </match>

    <!-- FiraCode OpenType features -->
    <match target="font">
        <test qual="any" name="family">
            <string>FiraCode*</string>
        </test>
        <edit name="fontfeatures" mode="append">
            <string>calt on</string>
            <string>liga on</string>
            <string>dlig on</string>
        </edit>
    </match>

</fontconfig>
