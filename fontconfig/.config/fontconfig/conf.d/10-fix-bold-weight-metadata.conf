<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!--
        Fix: Bold fonts with incorrect weight metadata
        
        Problem:
        Many fonts (especially TeX/LaTeX fonts) declare style="Bold" but weight=80.
        Weight 80 is the standard value for Regular/Book weight, not Bold.
        Bold should use weight=200 according to fontconfig/CSS standards.
        
        This causes fontconfig to incorrectly match Bold faces when Regular is requested,
        and browsers/applications cannot properly render bold text.
        
        Solution:
        Use target="scan" to fix metadata at font scanning time.
        Reassign weight from 80 to 200 for Bold faces only.
        Regular faces keep their correct weight=80.
        This allows proper weight matching: CSS font-weight:400 → Regular, font-weight:700 → Bold
        
        Alternative approaches (not used):
        - target="pattern": Would force all requests to a fixed weight (loses Bold/Regular distinction)
        - Modifying font files: Requires copying system fonts, harder to maintain
        
        Technical Details:
        - qual="any": Required for fonts with multiple values in a field (e.g., Theano has style="Regular" "Bold")
                      Matches if ANY value in the list matches. Without it, only the first value is checked.
        - compare="contains": Matches if the test string is a substring (e.g., "Theano" matches "Theano Didot")
                              Useful for matching font families with variations.
        - target="scan": Applies rules when fontconfig scans font files, modifying their metadata in the cache.
                         This is different from target="pattern" which modifies user requests.
        - binding="same": Preserves the original binding strength when editing values.
        
        Verification:
        After applying this config, verify with:
          fc-match "FandolSong:style=Bold" family style weight
          # Expected output: weight=200
          
        To check all fonts:
          ~/playground/fontfix/check-font-weights-simple.sh
          
        After changes, refresh font cache:
          rm -rf ~/.cache/fontconfig/* && fc-cache -fr
        
        References:
        - https://bbs.archlinux.org/viewtopic.php?id=227086 (similar issue with Operator Mono)
        - Fontconfig weight values: Regular=80, Bold=200 (FC_WEIGHT_BOOK=80, FC_WEIGHT_BOLD=200)
        - Fontconfig qualifiers: https://www.freedesktop.org/software/fontconfig/fontconfig-user.html
        - Issue discovered by scanning script: check-font-weights-simple.sh
    -->

    <!-- ========================================== -->
    <!-- Chinese Fonts (Fandol family)              -->
    <!-- ========================================== -->

    <match target="scan">
        <test name="family" qual="any">
            <string>FandolSong</string>
        </test>
        <test name="style" qual="any">
            <string>Bold</string>
        </test>
        <edit name="weight" mode="assign" binding="same">
            <int>200</int>
        </edit>
    </match>

    <match target="scan">
        <test name="family" qual="any">
            <string>FandolHei</string>
        </test>
        <test name="style" qual="any">
            <string>Bold</string>
        </test>
        <edit name="weight" mode="assign" binding="same">
            <int>200</int>
        </edit>
    </match>

    <!-- ========================================== -->
    <!-- TeX/LaTeX Fonts                            -->
    <!-- ========================================== -->

    <!-- DANTE family (logo font)
         Use compare="contains" to match both "Bold" and "Bold-Italic" styles -->
    <match target="scan">
        <test name="family" qual="any">
            <string>DANTE</string>
        </test>
        <test name="style" qual="any" compare="contains">
            <string>Bold</string>
        </test>
        <edit name="weight" mode="assign" binding="same">
            <int>200</int>
        </edit>
    </match>

    <!-- Theano family (Didot, Modern, Old Style)
         Note: These fonts have multiple style values: style="Regular"(s) "Bold"(s)
         Must use qual="any" to match the second value "Bold"
         Use compare="contains" to match all Theano variants (Didot, Modern, Old Style) -->
    <match target="scan">
        <test name="family" qual="any" compare="contains">
            <string>Theano</string>
        </test>
        <test name="style" qual="any" compare="contains">
            <string>Bold</string>
        </test>
        <edit name="weight" mode="assign" binding="same">
            <int>200</int>
        </edit>
    </match>

    <!-- NewComputerModern Devanagari -->
    <match target="scan">
        <test name="family" qual="any">
            <string>NewComputerModern 10 Devanagari</string>
        </test>
        <test name="style" qual="any">
            <string>Bold</string>
        </test>
        <edit name="weight" mode="assign" binding="same">
            <int>200</int>
        </edit>
    </match>

    <!-- Latin Modern Sans Quotation
         Use compare="contains" to match all variants (8 Bold, 8 Bold Oblique, etc.) -->
    <match target="scan">
        <test name="family" qual="any" compare="contains">
            <string>Latin Modern Sans Quotation</string>
        </test>
        <test name="style" qual="any" compare="contains">
            <string>Bold</string>
        </test>
        <edit name="weight" mode="assign" binding="same">
            <int>200</int>
        </edit>
    </match>

    <!-- MFB Oldstyle - Only fix Bold, not Regular
         Note: MFBOldstyle-Regular.otf should remain at weight=80 -->
    <match target="scan">
        <test name="family" qual="any" compare="contains">
            <string>MFB Oldstyle</string>
        </test>
        <test name="style" qual="any">
            <string>Bold</string>
        </test>
        <edit name="weight" mode="assign" binding="same">
            <int>200</int>
        </edit>
    </match>

    <!-- Frm: Frm-Bold.otf has style="Regular" but is actually not a real bold font.
         This is a misnamed file. Skip fixing it as there's no real Frm Bold variant.
         The true regular font is Forum-Regular.otf (different family name "Forum"). -->

    <!-- ========================================== -->
    <!-- Decorative Fonts                           -->
    <!-- ========================================== -->

    <!-- Poiret One -->
    <match target="scan">
        <test name="family" qual="any">
            <string>Poiret One</string>
        </test>
        <test name="style" qual="any">
            <string>Bold</string>
        </test>
        <edit name="weight" mode="assign" binding="same">
            <int>200</int>
        </edit>
    </match>

    <!-- ========================================== -->
    <!-- Maintenance Guide                          -->
    <!-- ========================================== -->
    <!--
        How to add fixes for new fonts:
        
        1. Identify problematic fonts:
           Run the detection script:
             ~/playground/fontfix/check-font-weights-simple.sh
           
        2. Inspect font metadata:
           fc-query /path/to/font.otf | grep -E "(family|style|weight)"
           
           Look for fonts where:
           - style contains "Bold" (or "Bold-Italic", etc.)
           - weight is 80 instead of 200
           
        3. Add a fix rule:
           - Use qual="any" on all tests (handles multi-value fields)
           - Use compare="contains" if you need substring matching
           - Only fix Bold fonts, leave Regular/Italic at weight=80
           
        4. Test the fix:
           a) Deploy the config:
              cd ~/dotfiles && stow -R fontconfig
           
           b) Clear cache and rescan:
              rm -rf ~/.cache/fontconfig/* && fc-cache -fr
           
           c) Verify the fix:
              fc-match "FontName:style=Bold" family style weight
              # Should show: weight=200
           
        5. Verify no side effects:
           fc-match "FontName:style=Regular" family style weight
           # Should still show: weight=80
        
        Common pitfalls:
        - Don't fix Regular fonts (even if the file is named *-Bold.otf)
        - Check if the font has multiple style values (use fc-query)
        - Always use qual="any" for consistency
        - Test both Bold and Regular variants after changes
    -->

</fontconfig>
