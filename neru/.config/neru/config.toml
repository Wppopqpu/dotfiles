# neru在收到hotkey时不会独占它,
# 所以改在niri.kdl中定义.
[hotkeys]
"Primary+Shift+C" = "__disabled__"
"Primary+Shift+Space" = "__disabled__"
"Primary+Shift+G" = "__disabled__"
"Primary+Shift+S" = "__disabled__"

# Tokyo Night 深色主题
[theme.dark]
surface       = "#1a1b26"
accent        = "#7aa2f7"
accent_alt    = "#bb9af7"
on_accent_alt = "#1a1b26"
text          = "#c0caf5"

# Hints 模式 - 无障碍元素提示 + OCR 识别
[hints]
strategy = "vision"
hint_characters = "asdfghjkl"
label_direction = "reverse"
clickable_roles = ["button", "link", "text_field", "checkbox", "radio", "combo_box", "menu_item", "tab", "cell"]

[hints.vision]
detect_text = true
request_timeout_ms = 5000
minimum_confidence = 0.3

[hints.ui]
font_size = 12
border_radius = 4
border_width = 1
placement = "bottom"

[hints.boundary_highlight]
enabled = false

[hints.search_input_ui]
position = "bottom_center"
width = 360

# Grid 模式 - 屏幕坐标网格
[grid]
live_match_update = true
hide_unmatched = true

[grid.ui]
font_size = 12
border_width = 1

# Recursive Grid 模式 - 递归网格精确点击
[recursive_grid]
grid_cols = 3
grid_rows = 3
keys = "rtyfghvbn"
max_depth = 10

[recursive_grid.ui]
font_size = 10
line_width = 1
label_background = true

[recursive_grid.animation]
enabled = true
duration_ms = 100

# Scroll 模式 - 键盘驱动滚动
[scroll]
scroll_step = 50
scroll_step_half = 500
scroll_step_full = 1000000

# 模式指示器 - 跟随光标显示当前模式
[mode_indicator]
  [mode_indicator.hints]
  enabled = true
  text = "Hints"

  [mode_indicator.grid]
  enabled = true
  text = "Grid"

  [mode_indicator.recursive_grid]
  enabled = true
  text = "RecurGrid"

  [mode_indicator.scroll]
  enabled = true
  text = "Scroll"

# 鼠标操作指示器 - 点击时的视觉反馈
[mouse_action_indicator]
enabled = true
actions = ["left_click", "right_click", "middle_click"]

[mouse_action_indicator.ui]
size = 28
border_width = 2
shape = "circle"

# 平滑光标 - 动画鼠标移动
[smooth_cursor]
move_mouse_enabled = true
steps = 16
max_duration = 300
duration_per_pixel = 0.15
relative_movement_duration = 60

# 平滑滚动 - 滚动动画
[smooth_scroll]
enabled = true
steps = 25
max_duration = 250
duration_per_pixel = 1.5

# 长按重复 - 持续按键时重复操作并加速
[held_repeat]
enabled = true
initial_delay_ms = 200
interval_ms = 50
accel_enabled = true
accel_ramp_ms = 800
accel_max_multiplier = 3.0
accel_targets = ["move_mouse_relative"]

# 粘滞修饰符 - 模式内修饰键粘滞
[sticky_modifiers]
enabled = true
tap_max_duration = 250

# 虚拟光标 - 隐藏系统光标时显示的替代标记
[virtual_pointer]
  [virtual_pointer.ui]
  char = "●"
  font_size = 10

# 系统托盘图标
[systray]
enabled = true

# 日志
[logging]
log_level = "info"
disable_file_logging = true
